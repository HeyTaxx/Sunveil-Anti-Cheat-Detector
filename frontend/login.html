<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Admin Portal — Sunveil AC</title>
    <meta http-equiv="Content-Security-Policy" content="default-src 'self'; script-src 'self' 'unsafe-inline'; style-src 'self' 'unsafe-inline' https://fonts.googleapis.com https://cdnjs.cloudflare.com; font-src 'self' https://fonts.gstatic.com https://cdnjs.cloudflare.com; img-src 'self' data:;">
    
    <!-- Fonts -->
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Outfit:wght@300;400;600;800&family=Inter:wght@400;500;600&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    
    <style>
        :root {
            --bg: #060609;
            --glass: rgba(15, 15, 25, 0.88);
            --border: rgba(255, 255, 255, 0.08);
            --accent-1: #10b981; /* Emerald Green */
            --accent-2: #3b82f6; /* Blue */
            --accent-glow: rgba(16, 185, 129, 0.3);
            --text: #ffffff;
            --muted: #9ca3af;
        }

        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        body {
            background: var(--bg);
            font-family: 'Inter', sans-serif;
            color: var(--text);
            min-height: 100vh;
            display: flex;
            align-items: center;
            justify-content: center;
            padding: 24px;
            overflow: hidden;
            position: relative;
        }

        /* Fixed background with fallback */
        body::before {
            content: '';
            position: absolute;
            inset: 0;
            background: url('bg.png') center/cover no-repeat;
            background: image-set(url('bg.webp') type('image/webp'), url('bg.png') type('image/png')) center/cover no-repeat;
            filter: brightness(0.25) saturate(1.2);
            z-index: -2;
        }

        .background-overlay {
            position: absolute;
            inset: 0;
            background: radial-gradient(circle at center, transparent 0%, var(--bg) 100%),
                        linear-gradient(to bottom, rgba(6, 6, 9, 0.4) 0%, var(--bg) 95%);
            z-index: -1;
            pointer-events: none;
        }

        .card {
            background: var(--glass);
            border: 1px solid var(--border);
            border-radius: 16px;
            padding: 40px;
            width: 100%;
            max-width: 440px;
            backdrop-filter: blur(20px);
            -webkit-backdrop-filter: blur(20px);
            box-shadow: 0 24px 64px rgba(0, 0, 0, 0.6);
            position: relative;
            z-index: 1;
            animation: fadeIn 0.6s ease-out;
        }

        @keyframes fadeIn {
            from { opacity: 0; transform: translateY(20px); }
            to { opacity: 1; transform: translateY(0); }
        }

        .logo-row {
            display: flex;
            align-items: center;
            gap: 12px;
            margin-bottom: 24px;
        }

        .logo-icon {
            width: 36px;
            height: 36px;
            background: linear-gradient(135deg, var(--accent-1), var(--accent-2));
            border-radius: 8px;
            display: flex;
            align-items: center;
            justify-content: center;
            font-size: 18px;
            color: #fff;
            box-shadow: 0 0 15px var(--accent-glow);
        }

        .logo-row span {
            font-family: 'Outfit', sans-serif;
            font-weight: 800;
            font-size: 20px;
            background: linear-gradient(135deg, #fff, #9ca3af);
            -webkit-background-clip: text;
            -webkit-text-fill-color: transparent;
            background-clip: text;
            letter-spacing: -0.5px;
        }

        .logo-row span strong {
            background: linear-gradient(135deg, var(--accent-1), var(--accent-2));
            -webkit-background-clip: text;
            -webkit-text-fill-color: transparent;
            background-clip: text;
        }

        h2 {
            font-family: 'Outfit', sans-serif;
            font-size: 24px;
            font-weight: 700;
            margin-bottom: 6px;
            letter-spacing: -0.5px;
        }

        .sub {
            color: var(--muted);
            font-size: 14px;
            margin-bottom: 28px;
            line-height: 1.5;
        }

        .form-group {
            margin-bottom: 20px;
        }

        label {
            display: block;
            font-size: 13px;
            font-weight: 500;
            color: var(--muted);
            margin-bottom: 8px;
            text-transform: uppercase;
            letter-spacing: 0.5px;
        }

        .input-wrapper {
            position: relative;
        }

        .input-wrapper i {
            position: absolute;
            left: 14px;
            top: 50%;
            transform: translateY(-50%);
            color: var(--muted);
            font-size: 16px;
        }

        input {
            width: 100%;
            padding: 14px 14px 14px 42px;
            background: rgba(255, 255, 255, 0.04);
            border: 1px solid var(--border);
            border-radius: 8px;
            color: var(--text);
            font-size: 15px;
            font-family: 'Inter', sans-serif;
            outline: none;
            transition: all 0.3s ease;
        }

        input:focus {
            border-color: var(--accent-1);
            background: rgba(255, 255, 255, 0.07);
            box-shadow: 0 0 15px rgba(16, 185, 129, 0.15);
        }

        .btn {
            width: 100%;
            padding: 14px;
            background: linear-gradient(135deg, var(--accent-1), #059669);
            color: #fff;
            border: none;
            border-radius: 8px;
            font-size: 15px;
            font-weight: 700;
            font-family: 'Outfit', sans-serif;
            cursor: pointer;
            transition: all 0.3s ease;
            display: flex;
            align-items: center;
            justify-content: center;
            gap: 8px;
            box-shadow: 0 4px 15px var(--accent-glow);
            margin-top: 10px;
        }

        .btn:hover {
            transform: translateY(-2px);
            box-shadow: 0 6px 20px rgba(16, 185, 129, 0.5);
        }

        .btn:active {
            transform: translateY(0);
        }

        .alert {
            padding: 12px 16px;
            border-radius: 8px;
            font-size: 14px;
            margin-bottom: 20px;
            display: none;
            line-height: 1.5;
            align-items: center;
            gap: 10px;
        }

        .alert.error {
            display: flex;
            background: rgba(239, 68, 68, 0.1);
            border: 1px solid rgba(239, 68, 68, 0.25);
            color: #fca5a5;
        }

        .footer-note {
            text-align: center;
            margin-top: 24px;
            font-size: 12px;
            color: var(--muted);
        }

        .footer-note a {
            color: var(--text);
            text-decoration: none;
            transition: color 0.2s;
        }

        .footer-note a:hover {
            color: var(--accent-1);
        }
    </style>
</head>
<body>
    <div class="background-overlay"></div>

    <div class="card">
        <div class="logo-row">
            <div class="logo-icon">
                <i class="fa-solid fa-shield-halved"></i>
            </div>
            <span>SUNVEIL <strong>OVERWATCH</strong></span>
        </div>

        <h2>Administration Log</h2>
        <p class="sub">Verify authorization credentials to access the telemetry logs and threat intelligence records.</p>

        <div id="errorAlert" class="alert error">
            <i class="fa-solid fa-triangle-exclamation"></i>
            <span id="errorMessage">Invalid Credentials.</span>
        </div>

        <form id="loginForm">
            <div class="form-group">
                <label for="password">Security Password</label>
                <div class="input-wrapper">
                    <i class="fa-solid fa-key"></i>
                    <input type="password" id="password" placeholder="••••••••••••" required>
                </div>
            </div>
            <button type="submit" class="btn">
                <span>Access Console</span>
                <i class="fa-solid fa-arrow-right"></i>
            </button>
        </form>

        <p class="footer-note">Developed by <a href="https://bluestyle.dev" target="_blank">Blue Style Development</a></p>
    </div>

    <script>
        // Redirect to dashboard if already logged in
        if (sessionStorage.getItem('admin_token')) {
            window.location.href = 'index.html';
        }

        const form = document.getElementById('loginForm');
        const errorAlert = document.getElementById('errorAlert');
        const errorMessage = document.getElementById('errorMessage');

        form.addEventListener('submit', async (e) => {
            e.preventDefault();
            errorAlert.style.display = 'none';

            const password = document.getElementById('password').value;

            try {
                const response = await fetch('/api/login', {
                    method: 'POST',
                    headers: { 'Content-Type': 'application/json' },
                    body: JSON.stringify({ password })
                });

                const data = await response.json();

                if (response.ok && data.success) {
                    sessionStorage.setItem('admin_token', data.token);
                    window.location.href = 'index.html';
                } else {
                    errorMessage.textContent = data.error || 'Invalid administrator password.';
                    errorAlert.style.display = 'flex';
                }
            } catch (err) {
                errorMessage.textContent = 'Server connection failed. Is the API online?';
                errorAlert.style.display = 'flex';
                console.error('Login error:', err);
            }
        });
    </script>
</body>
</html>
